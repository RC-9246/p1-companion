<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">P1 Companion</title>
  <desc id="desc">从第一次安装，到持续的相处。中文图形向导、独立记忆与表达、自主活动和运行保护。GPT 主导新增工程。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1428"/><stop offset="1" stop-color="#142b43"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8fcaff"/><stop offset="1" stop-color="#7de6c0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9bc7f0" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="720" height="500" rx="24" fill="url(#bg)"/>
  <rect width="720" height="500" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Noto Sans CJK SC,Helvetica,Arial,sans-serif">
    <rect x="44" y="43" width="303" height="35" rx="17.5" fill="#19364c" stroke="#355a70"/>
    <circle cx="64" cy="60.5" r="4" fill="#7de6c0"/>
    <text x="78" y="66" fill="#b3d8e8" font-size="14" letter-spacing="1">SELF-HOSTED · GPT-DEVELOPED</text>
    <text x="41" y="169" fill="#f2f7ff" font-size="74" font-weight="700" letter-spacing="-3">P1 Companion</text>
    <text x="44" y="230" fill="url(#accent)" font-size="32" font-weight="500">从第一次安装，到持续的相处</text>
    <text x="44" y="277" fill="#a4b8ce" font-size="26">有记忆 · 会接续 · 可自主 · 能恢复</text>
    <g fill="#162f44" stroke="#32526f">
      <rect x="44" y="323" width="198" height="91" rx="16"/>
      <rect x="261" y="323" width="198" height="91" rx="16"/>
      <rect x="478" y="323" width="198" height="91" rx="16"/>
    </g>
    <g font-size="24" font-weight="600" fill="#eff6ff">
      <text x="67" y="361">图形安装</text><text x="284" y="361">独立记忆</text><text x="501" y="361">运行保护</text>
    </g>
    <g font-size="17" fill="#9db8ce">
      <text x="67" y="391">中文向导 · Beta</text><text x="284" y="391">私聊与群聊</text><text x="501" y="391">降载与恢复</text>
    </g>
    <text x="44" y="460" fill="#7894ae" font-size="17">4GB ARM 已部署验证 · 模型推理在云端</text>
